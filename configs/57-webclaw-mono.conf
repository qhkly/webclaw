<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  等宽字体别名。

  fontconfig 查不到某个字体家族时不会失败，而是松散匹配到它认为最接近的字体。
  容器里 `fc-match ui-monospace` / `fc-match "SF Mono"` 裸跑返回的是**比例字体**
  Noto Sans CJK SC，WebKitGTK 会直接采纳这个匹配结果。于是使用 macOS 字体名的
  应用（AI CLI Studio 的 xterm 终端）拿到比例字体，格宽按 'W' 量、字形却窄得多，
  每个字符都被摊在过宽的格子里。这里把这些在 Linux 上不存在的等宽字体名显式指向
  容器里真实装了的等宽字体。

  首选 DejaVu Sans Mono，而不是 Noto Sans Mono CJK SC。后者是 Source Han Mono 系，
  拉丁步进宽只有 0.500em，而 DejaVu / Hack / Liberation Mono / Noto Sans Mono 都是
  0.600em —— 字高一样、字宽少 17%，整屏英文看上去被横向压扁、字形发竖。
  代价是中英混排会留缝：终端格宽由拉丁字体决定，DejaVu 双宽格 = 1.204em，汉字
  1.000em，比两格窄 17%。这条缝是有意接受的，绝大多数 Linux 终端就是这个样子；
  列对齐不受影响，xterm 仍按 2 格排 CJK。

  Noto Sans Mono CJK SC 降为 append，只在 DejaVu 缺字形时接管 —— 中文正是走这条。

  必须装成 conf.d/57-*，不能用 /etc/fonts/local.conf：fonts.conf 先读 conf.d
  再读 local.conf，等轮到 local.conf 时 60-latin.conf 已经把泛型名 monospace
  从 family 列表里换掉了，针对 monospace 的规则就永远匹配不上。
-->
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>SF Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>SFMono-Regular</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!-- 裸 monospace（code-server 终端、App 探测兜底走的就是它）同样是拉丁优先、
       CJK 回退。 -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

</fontconfig>
