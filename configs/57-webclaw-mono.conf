<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  等宽字体别名。

  fontconfig 查不到某个字体家族时不会失败，而是松散匹配到它认为最接近的字体。
  容器里 `fc-match ui-monospace` / `fc-match "SF Mono"` 返回的是比例字体
  Noto Sans CJK SC，WebKitGTK 会直接采纳这个匹配结果。于是使用 macOS 字体名
  的应用（AI CLI Studio 的 xterm 终端）拿到比例字体，格宽按 'W' 量、字形却窄
  得多，每个字符都被摊在过宽的格子里。

  这里把这些在 Linux 上不存在的等宽字体名显式指向容器里真实装了的等宽字体。

  必须装成 conf.d/57-*，不能用 /etc/fonts/local.conf：fonts.conf 先读 conf.d
  再读 local.conf，等轮到 local.conf 时 60-latin.conf 已经把泛型名 monospace
  从 family 列表里换掉了，针对 monospace 的规则就永远匹配不上。

  首选 Noto Sans Mono CJK SC 而不是 DejaVu Sans Mono，是因为终端格宽由 Latin
  字体决定：DejaVu 的字宽是 0.602em，中文回退过来是 1.000em，比两格
  （1.204em）窄 17%，中英混排会留缝。Noto Sans Mono CJK 的 Latin 是 0.500em、
  汉字 1.000em，严格 1:2，才对得齐。DejaVu 留作它缺字形时的后备。
-->
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>SF Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>SFMono-Regular</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <!-- 裸 monospace（code-server 终端、App 探测兜底走的就是它）同样走 1:2 的
       等宽 CJK，而不是比例的 Noto Sans CJK 或对不齐的 DejaVu。 -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

</fontconfig>
