[program:proxy]
# mihomo 无头代理内核（见 scripts/start-proxy.sh）。
# user=root：建 TUN 设备、改路由表都要 CAP_NET_ADMIN，普通用户做不到。
# priority=50：早于 code-server / openclaw / dashboard 起来，
# 让它们启动时拉包就已经有代理可用。
# 订阅/分流从 ~/.webclaw/config.json 读（dashboard ⚙ 设置页写），没有环境变量入口。
# http_proxy 三个变量在这里显式清空：降级模式下 startup.sh 会给全局注入代理环境变量，
# 内核自己再读到就会自己代理自己（拉订阅直接死循环）。
command=/opt/start-proxy.sh
directory=/home/ubuntu
user=root
environment=HOME="/root",PROXY_DIR="/home/ubuntu/.webclaw/proxy",SAFE_PATHS="/opt/mihomo/ui",http_proxy="",https_proxy="",all_proxy="",HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY=""
priority=50
autostart=%(ENV_ENABLE_PROXY)s
autorestart=unexpected
startretries=5
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/proxy_stdout.log
stderr_logfile=/tmp/proxy_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
