[program:vibe-kanban]
# 服务本身跑在系统 Node 上，PATH 里带用户 Node，派生的 claude/codex 才找得到（见 webclaw-user-node-run）。
command=/usr/local/bin/webclaw-user-node-run --system-node /usr/local/bin/vibe-kanban
directory=/home/ubuntu/projects
user=ubuntu
environment=HOME="/home/ubuntu",HOST="127.0.0.1",PORT="10002"
priority=200
autostart=%(ENV_ENABLE_KANBAN)s
autorestart=false
startretries=5
startsecs=15
stdout_logfile=/tmp/vibe-kanban_stdout.log
stderr_logfile=/tmp/vibe-kanban_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
