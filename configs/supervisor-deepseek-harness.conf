[program:deepseek-harness]
command=/opt/start-deepseek-harness.sh
directory=/home/ubuntu
user=ubuntu
environment=HOME="/home/ubuntu",DSH_HOME="/home/ubuntu/.dsh"
priority=210
autostart=%(ENV_ENABLE_DEEPSEEK_HARNESS)s
autorestart=unexpected
startretries=5
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/deepseek_harness_stdout.log
stderr_logfile=/tmp/deepseek_harness_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
