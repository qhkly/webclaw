[program:claudecodeui]
# 服务本身跑在系统 Node 上，PATH 里带用户 Node，派生的 claude 才找得到（见 webclaw-user-node-run）。
command=/usr/local/bin/webclaw-user-node-run --system-node /usr/local/bin/claude-code-ui --port 10007
directory=/home/ubuntu/projects
user=ubuntu
environment=HOME="/home/ubuntu",NODE_ENV="production",PORT="10007",VITE_IS_PLATFORM="true"
priority=200
autostart=%(ENV_ENABLE_CLAUDECODEUI)s
autorestart=false
startretries=5
startsecs=15
stdout_logfile=/tmp/claudecodeui_stdout.log
stderr_logfile=/tmp/claudecodeui_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
