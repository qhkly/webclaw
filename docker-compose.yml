services:
  webclaw:
    image: land007/webclaw:latest
    build: .
    container_name: webclaw
    ports:
      - "20000:20000"  # Dashboard (四合一入口，via Caddy)
    # sshfs 挂载远程服务器目录需要 FUSE：容器要能访问 /dev/fuse 并具备 SYS_ADMIN
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dna-data:/home/ubuntu/dna          # DNA 目录：项目源码，空时自动 clone
      - projects:/home/ubuntu/projects
      - obsidian-data:/home/ubuntu/obsidian # Obsidian 笔记库目录
      - vibe-kanban-data:/home/ubuntu/.local/share/vibe-kanban
      - code-server-data:/home/ubuntu/.code-server
      - user-data:/home/ubuntu/.local/share
      - gitconfig:/home/ubuntu/.gitconfig-vol
      - openclaw-data:/home/ubuntu/.openclaw
      - chrome-data:/home/ubuntu/.config
      - v2rayn-data:/home/ubuntu/.local/share/v2rayN
      - recordings:/home/ubuntu/recordings
      - webclaw-config:/home/ubuntu/.webclaw  # 持久化运行时配置
      # 个人技能目录：默认命名卷（远程 git 同步模式用）；
      # 本地同机部署时在 .env 设 SKILLS_HOST_DIR=$HOME/.webcode/skills 即变为 bind-mount，实时双向同步
      - ${SKILLS_HOST_DIR:-skills-data}:/home/ubuntu/skills
      - ssh-data:/home/ubuntu/.ssh           # SSH密钥和配置持久化
      - servers-data:/home/ubuntu/servers    # 远程服务器运维工作目录（远程服务器面板生成）
      - ai-studio-data:/home/ubuntu/.ai-studio  # 远程主机的 SSH 密钥与连接配置
      - ./backups:/home/ubuntu/backups       # 备份目录（映射到宿主机）
    tmpfs:
      - /run:size=10M
    environment:
      - MODE=${MODE:-desktop}
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-changeme}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-changeme}
      - PASSWORD=${VNC_PASSWORD:-changeme}
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - DNA_REPO_URL=${DNA_REPO_URL:-https://github.com/land007/webcode}
      - ENABLE_KANBAN=${ENABLE_KANBAN:-false}
      - ENABLE_OPENCLAW=${ENABLE_OPENCLAW:-true}
      - ENABLE_CLAUDECODEUI=${ENABLE_CLAUDECODEUI:-false}
      # AI Studio 无头节点：开了之后本机的 WebCode AI Studio 可以把这个容器当成
      # 一台远程 Studio 接进去。走 20000 的统一代理，不额外开端口：
      #   http://<host>:20000/proxy/10010
      # token 默认取 AUTH_PASSWORD（两道门要同一把钥匙，见 start-webcode-studiod.sh）。
      - ENABLE_WEBCODE_STUDIOD=${ENABLE_WEBCODE_STUDIOD:-false}
      - AI_STUDIO_PEER_TOKEN=${AI_STUDIO_PEER_TOKEN:-}
      - AI_STUDIO_PEER_SCOPE=${AI_STUDIO_PEER_SCOPE:-lan}
      - HOST_API_TOKEN=${HOST_API_TOKEN:-webclaw-host-token-change-me}
      # 个人技能云同步（远程部署）：在 .env 填入技能仓库地址与访问令牌后自动双向同步
      - SKILLS_REPO_URL=${SKILLS_REPO_URL:-}
      - SKILLS_REPO_TOKEN=${SKILLS_REPO_TOKEN:-}
      - SKILLS_BRANCH=${SKILLS_BRANCH:-main}
      - SKILLS_SYNC_INTERVAL=${SKILLS_SYNC_INTERVAL:-300}
      - CLEAN_DESKTOP=${CLEAN_DESKTOP:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "512m"
    restart: unless-stopped

volumes:
  skills-data:
  dna-data:
  projects:
  obsidian-data:
  vibe-kanban-data:
  code-server-data:
  user-data:
  openclaw-data:
  chrome-data:
  v2rayn-data:
  gitconfig:
  recordings:
  webclaw-config:
  ssh-data:
  servers-data:
  ai-studio-data:
